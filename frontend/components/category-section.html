<div class="category-section">
    <div class="section-header">
        <h4>Select Product Category</h4>
        <p>Choose a popular category or type your own category if it is not listed.</p>
    </div>

    <div class="category-tiles" id="categoryTiles">
        <div class="category-tile" data-category="footwear">👟 Footwear</div>
        <div class="category-tile" data-category="electronics">💻 Electronics</div>
        <div class="category-tile" data-category="clothing">👕 Clothing</div>
        <div class="category-tile" data-category="bags">🎒 Bags</div>
        <div class="category-tile" data-category="fitness">🏋️ Fitness</div>
        <div class="category-tile" data-category="home">🏠 Home</div>
        <div class="category-tile" data-category="beauty">💄 Beauty</div>
        <div class="category-tile" data-category="gaming">🎮 Gaming</div>
    </div>

    <div class="custom-category-box">
        <label for="customCategoryInput">Category not listed?</label>
        <input 
            type="text" 
            id="customCategoryInput" 
            placeholder="Type custom category, e.g., skincare, books, kitchen"
        >
    </div>

    <p id="selectedCategoryText" class="selected-category-text">
        No category selected
    </p>
</div>
